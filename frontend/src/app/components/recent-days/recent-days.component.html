<div class="card recent-days-card">
  <div class="card-header">
    <h2>Last 7 Days</h2>
    <p>Your daily spending this week.</p>
  </div>

  <div class="recent-days">
    @for (day of recentDays; track day.label) {
      <div class="day-row" [class.today]="day.currentPeriod" [class.no-spending]="day.total === 0">
        <div class="day-info">
          <span class="day-label">{{ day.humanizedLabel }}</span>
          <span class="day-count" [class.has-expenses]="day.count > 0">
            {{ day.count }} expense{{ day.count === 1 ? '' : 's' }}
          </span>
        </div>
        <div class="day-right">
          <div class="day-bar-track">
            <div class="day-bar-fill" [style.width.%]="barWidth(day)" [class.today-bar]="day.currentPeriod"></div>
          </div>
          <span class="day-amount">{{ day.total | currency:'BDT':'symbol-narrow':'1.2-2' }}</span>
        </div>
      </div>
    }
  </div>
</div>
