<div class="card trend-card">
  <div class="card-header">
    <h2>Spending Trend</h2>
    <p>Last 6 months overview</p>
  </div>

  <div class="chart-container">
    <div class="chart-bars">
      @for (month of months; track month.label) {
        <div class="chart-col">
          <div class="chart-value">{{ month.total > 0 ? (month.total | currency:'BDT':'symbol-narrow':'1.0-0') : '–' }}</div>
          <div class="chart-bar-track">
            <div class="chart-bar-fill" [style.height.%]="barHeight(month)" [class.current]="$index === months.length - 1"></div>
          </div>
          <div class="chart-label">{{ month.shortLabel }}</div>
          <div class="chart-count">{{ month.count }}</div>
        </div>
      }
    </div>
  </div>
</div>
